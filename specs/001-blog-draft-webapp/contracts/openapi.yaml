openapi: 3.0.3
info:
  title: Blog Draft Generator API
  description: |
    ブログ下書き生成 Web アプリケーションの REST API 仕様。
    
    ## 主要機能
    - ブログ記事の概要から Markdown 形式の下書きを生成
    - LLM に送信されるプロンプトのプレビュー表示（デバッグ用）
    - RAG（Azure AI Search）による過去記事からのコンテキスト補強
    
    ## セキュリティ
    - すべてのエンドポイントはサーバ側で処理され、API キーはブラウザに送信されない
    - プレビューモードで表示されるプロンプトはログに記録されない
  version: 1.0.0
  contact:
    name: Blog Draft WebApp
servers:
  - url: https://localhost:5001
    description: Development server
  - url: https://blog-draft-webapp.azurewebsites.net
    description: Production server

paths:
  /draft:
    post:
      summary: ブログ下書きを生成
      description: |
        ユーザーが入力した記事の概要から、LLM を使用して Markdown 形式のブログ下書きを生成する。
        RAG が有効な場合、過去記事から関連情報を検索してプロンプトに追加する。
      operationId: generateDraft
      tags:
        - Draft Generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateDraftRequest'
            examples:
              basic:
                summary: 基本的な概要入力
                value:
                  overview: |
                    # タイトル案
                    Azure Functions で Durable Functions を使った非同期処理
                    
                    # 想定読者
                    Azure Functions 初心者、非同期処理を実装したい開発者
                    
                    # 目的
                    長時間実行される処理を Durable Functions で実装する方法を解説
                    
                    # 主要な手順
                    - Durable Functions のセットアップ
                    - Orchestrator 関数の実装
                    - Activity 関数の実装
                    - エラーハンドリングとリトライ
      responses:
        '200':
          description: 下書きの生成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateDraftResponse'
              examples:
                success:
                  summary: 生成成功（RAG あり）
                  value:
                    draft: |
                      # Azure Functions で Durable Functions を使った非同期処理
                      
                      ## はじめに
                      長時間実行される処理を実装する際、Azure Functions の Durable Functions を使用すると...
                      
                      ## 前提条件
                      - Azure サブスクリプション
                      - Visual Studio Code
                      ...
                    model: gpt-4o
                    generatedAt: "2026-01-11T10:30:00Z"
                    ragHitCount: 3
                    warning: null
                shortOutputWarning:
                  summary: 生成結果が短すぎる
                  value:
                    draft: |
                      # Azure Functions で Durable Functions を使った非同期処理
                      
                      ## 概要
                      要点のみを簡潔に記述
                    model: gpt-4o
                    generatedAt: "2026-01-11T10:30:00Z"
                    ragHitCount: 1
                    warning: "生成結果が短すぎます。入力内容を詳しくするか、設定を確認してください"
        '400':
          description: リクエストのバリデーションエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emptyOverview:
                  summary: 概要が空
                  value:
                    errorCode: INVALID_REQUEST
                    message: 記事の概要を入力してください
                    details: "Overview field is required"
                    requestId: "req_12345"
                tooShort:
                  summary: 概要が短すぎる
                  value:
                    errorCode: INVALID_REQUEST
                    message: 概要は 10 文字以上入力してください
                    details: "Overview must be at least 10 characters"
                    requestId: "req_12346"
        '500':
          description: サーバ内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                configError:
                  summary: 設定不備
                  value:
                    errorCode: CONFIG_ERROR
                    message: システムが正しく構成されていません。管理者に連絡してください
                    details: "LLM API key is not configured"
                    requestId: "req_12347"
                ragError:
                  summary: RAG 検索の失敗
                  value:
                    errorCode: RAG_ERROR
                    message: 関連記事の検索に失敗しました
                    details: "Azure AI Search が 503 を返却しました"
                    requestId: "req_12350"
                    isRetryable: true
        '502':
          description: LLM API エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                llmError:
                  summary: LLM サービスエラー
                  value:
                    errorCode: LLM_ERROR
                    message: LLM サービスでエラーが発生しました
                    details: "Upstream service returned 503"
                    requestId: "req_12348"
        '504':
          description: LLM API タイムアウト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                timeout:
                  summary: タイムアウト
                  value:
                    errorCode: LLM_TIMEOUT
                    message: 生成に時間がかかりすぎています。もう一度お試しください
                    details: "Request timeout after 120 seconds"
                    requestId: "req_12349"

  /draft/preview:
    post:
      summary: LLM 入力内容をプレビュー（デバッグモード）
      description: |
        LLM に送信される予定のプロンプト全文（文体カード + RAG コンテキスト + ユーザー概要）を表示する。
        LLM API は呼び出されない。デバッグおよび品質改善用途。
        
        **セキュリティ注意**: プレビュー結果には機微情報（文体カード）が含まれる。
        この内容はログに記録されない。
      operationId: previewPrompt
      tags:
        - Draft Generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewPromptRequest'
            examples:
              basic:
                summary: 基本的な概要入力
                value:
                  overview: |
                    # タイトル案
                    Azure Functions で Durable Functions を使った非同期処理
                    
                    # 想定読者
                    Azure Functions 初心者
      responses:
        '200':
          description: プロンプトのプレビュー成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewPromptResponse'
              examples:
                success:
                  summary: プレビュー成功
                  value:
                    prompt: |
                      [システムプロンプト]
                      あなたはテックブログの執筆アシスタントです...
                      
                      [文体カード]
                      ## 執筆方針
                      - 読者に寄り添う
                      - 具体例を豊富に
                      ...
                      
                      [過去記事からの関連情報]
                      1. [Azure Functions の基礎](https://example.com/article1)
                         > Azure Functions は、サーバーレスコンピューティング...
                      
                      [新規記事の概要]
                      # タイトル案
                      Azure Functions で Durable Functions を使った非同期処理...
                    ragHitCount: 1
                    warning: null
        '400':
          description: リクエストのバリデーションエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      summary: ヘルスチェック
      description: アプリケーションの稼働状態を確認する。設定の検証は行わない。
      operationId: healthCheck
      tags:
        - Health
      responses:
        '200':
          description: アプリケーションは正常に稼働中
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time
                    example: "2026-01-11T10:30:00Z"

components:
  schemas:
    GenerateDraftRequest:
      type: object
      required:
        - overview
      properties:
        overview:
          type: string
          minLength: 10
          maxLength: 5000
          description: |
            ユーザーが入力した記事の概要。
            タイトル案、目的、想定読者、手順の箇条書きなどを含む。
          example: |
            # タイトル案
            Azure Functions で Durable Functions を使った非同期処理
            
            # 想定読者
            Azure Functions 初心者、非同期処理を実装したい開発者
            
            # 目的
            長時間実行される処理を Durable Functions で実装する方法を解説

    GenerateDraftResponse:
      type: object
      required:
        - draft
        - model
        - generatedAt
        - ragHitCount
      properties:
        draft:
          type: string
          description: 生成された Markdown 形式のブログ下書き。
          example: |
            # Azure Functions で Durable Functions を使った非同期処理
            
            ## はじめに
            長時間実行される処理を実装する際、Azure Functions の Durable Functions を使用すると...
        model:
          type: string
          description: 使用された LLM モデル ID。
          example: gpt-4o
        generatedAt:
          type: string
          format: date-time
          description: 生成日時（UTC）。
          example: "2026-01-11T10:30:00Z"
        ragHitCount:
          type: integer
          minimum: 0
          description: RAG で取得されたチャンク数。
          example: 3
        warning:
          type: string
          nullable: true
          description: |
            警告メッセージ。生成結果が 100 文字未満などの注意事項を通知。
            null の場合は警告なし。
          example: "生成結果が短すぎます。入力内容を詳しくするか、設定を確認してください"

    PreviewPromptRequest:
      type: object
      required:
        - overview
      properties:
        overview:
          type: string
          minLength: 10
          maxLength: 5000
          description: |
            ユーザーが入力した記事の概要。
            GenerateDraftRequest と同一のバリデーションルール。
          example: |
            # タイトル案
            Azure Functions で Durable Functions を使った非同期処理

    PreviewPromptResponse:
      type: object
      required:
        - prompt
        - ragHitCount
      properties:
        prompt:
          type: string
          description: |
            LLM に送信される予定のプロンプト全文。
            文体カード（機微情報）を含む。
          example: |
            [システムプロンプト]
            あなたはテックブログの執筆アシスタントです...
            
            [文体カード]
            ## 執筆方針
            - 読者に寄り添う
            ...
            
            [過去記事からの関連情報]
            1. [Azure Functions の基礎](https://example.com/article1)
               > Azure Functions は、サーバーレスコンピューティング...
            
            [新規記事の概要]
            # タイトル案
            Azure Functions で Durable Functions を使った非同期処理...
        ragHitCount:
          type: integer
          minimum: 0
          description: RAG で取得されたチャンク数。
          example: 1
        warning:
          type: string
          nullable: true
          description: |
            警告メッセージ（将来的な拡張用途）。現状は null。
          example: null

    ErrorResponse:
      type: object
      required:
        - errorCode
        - message
        - requestId
      properties:
        errorCode:
          type: string
          enum:
            - INVALID_REQUEST
            - CONFIG_ERROR
            - LLM_TIMEOUT
            - LLM_ERROR
            - RAG_ERROR
          description: エラーコード。
          example: INVALID_REQUEST
        message:
          type: string
          description: ユーザー向けエラーメッセージ。
          example: 記事の概要を入力してください
        details:
          type: string
          nullable: true
          description: |
            詳細情報（開発環境のみ含める）。
            本番環境では null。
          example: "Overview field is required"
        requestId:
          type: string
          description: リクエスト ID（ログ追跡用）。
          example: req_12345
        isRetryable:
          type: boolean
          description: 再試行可能なエラーかどうか。
          example: true

tags:
  - name: Draft Generation
    description: ブログ下書きの生成とプレビュー
  - name: Health
    description: ヘルスチェック
